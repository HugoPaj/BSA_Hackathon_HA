plugins { id 'com.android.application' }
android {
    namespace 'ch.swissquote.idsigner'
    compileSdk 35
    defaultConfig {
        applicationId 'ch.swissquote.idsigner'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.debug }
    }
    packagingOptions { resources { excludes += ['META-INF/*'] } }
}
dependencies { implementation project(':jmulticard') }
